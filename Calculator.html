<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --bg1: #0f172a;
            --bg2: #1e293b;
            --card: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text: #f8fafc;
            --muted: #cbd5e1;
            --number: #38bdf8;
            --operator: #a78bfa;
            --equals: #10b981;
            --clear: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
    
            overflow: hidden;
        }

     

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(15px, -18px); }
        }

        .calculator-container {
            width: min(380px, calc(100vw - 24px));
            padding: 28px;
            background: var(--card);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 32px 100px rgba(15, 23, 42, 0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.6s ease both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #inputbox {
            width: 100%;
            padding: 18px 20px;
            border: 1px solid rgba(226, 232, 240, 0.4);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 500;
            text-align: right;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        #inputbox:focus {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(255, 255, 255, 0.15);
        }

        #inputbox::placeholder {
            color: rgba(203, 213, 225, 0.5);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 16px;
            padding: 16px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        button:hover::before {
            opacity: 1;
        }

      

        /* Equals button */
        #equals {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
            font-size: 1.4rem;
        }

        #equals:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.45);
        }

        #equals:active {
            transform: translateY(0);
        }

      
    </style>
</head>
<body>
    <div class="calculator-container">
        <input type="text" placeholder="0" id="inputbox">
        <div class="button-grid">
    <button onclick="setVal(1)">1</button>
    <button onclick="setVal(2)">2</button>
    <button onclick="setVal(3)">3</button>
    <button onclick="setOp('+')">+</button>
    <button onclick="setVal(4)">4</button>
    <button onclick="setVal(5)">5</button>
    <button onclick="setVal(6)">6</button>
    <button onclick="setOp('-')">-</button>
    <button onclick="setVal(7)">7</button>
    <button onclick="setVal(8)">8</button>
    <button onclick="setVal(9)">9</button>
    <button onclick="setOp('*')">*</button>
    <button onclick="setVal(0)">0</button>
    <button onclick="removeLast()">❌</button>
    <button onclick="setOp('/')">/</button>
    <button id="equals">=</button>
    <button onclick="clr()" style="grid-column: span 2;">Clear</button>
        </div>
    </div>

    <script src="Calculator.js"></script>
</body>
</html>
